name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.6.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    uses: bluefunda/release-foundry/.github/workflows/release-please.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  # Docker builders use the Go version go.mod requires (#366).
  go-version:
    needs: [release]
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.go.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: go
        run: echo "version=$(awk '/^go /{print $2}' go.mod)" >> "$GITHUB_OUTPUT"

  goreleaser:
    needs: [release]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.release_created) }}
    uses: bluefunda/release-foundry/.github/workflows/go-binary-release.yml@main
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag_name }}
    permissions:
      contents: write # upload GoReleaser archives/checksums to the GitHub release
      id-token: write # mint the OIDC token for cosign keyless signing
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      NOTARIZATION_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
      NOTARIZATION_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
      NOTARIZATION_KEY: ${{ secrets.NOTARIZATION_KEY }}

  docker:
    needs: [release, go-version]
    if: ${{ needs.release.outputs.release_created }}
    uses: bluefunda/release-foundry/.github/workflows/docker-deploy.yml@main
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.release.outputs.tag_name }}
      build-args: |
        VERSION=${{ needs.release.outputs.tag_name }}
        GO_VERSION=${{ needs.go-version.outputs.version }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  # ghcr.io/bluefunda/abaper: the `abaper serve` REST backend that abaper-bff
  # and abaper-mcp call. Production pulls :latest (bluefunda/gitops,
  # stacks/apps/abaper); Komodo redeploys it.
  docker-abaper:
    needs: [release, go-version]
    if: ${{ needs.release.outputs.release_created }}
    uses: bluefunda/release-foundry/.github/workflows/docker-deploy.yml@main
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.release.outputs.tag_name }}
      image-name: abaper
      file: abaper/Dockerfile
      build-args: |
        VERSION=${{ needs.release.outputs.tag_name }}
        GO_VERSION=${{ needs.go-version.outputs.version }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  release-notes:
    needs: [release, goreleaser]
    if: ${{ needs.release.outputs.release_created }}
    uses: bluefunda/release-foundry/.github/workflows/github-release-notes.yml@main
    with:
      tag: ${{ needs.release.outputs.tag_name }}
      mode: append
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
