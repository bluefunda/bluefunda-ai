version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        # CLI output — errors writing to stdout/stderr are unrecoverable
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush
        - (*encoding/json.Encoder).Encode
        # Deferred cleanup — errors on close are unactionable in CLI
        - (*github.com/bluefunda/bluefunda-ai/internal/grpc.Conn).Close
        - (*google.golang.org/grpc.ClientConn).Close
  exclusions:
    rules:
      # Carried over from bluefunda/abaper's own lint config when it was
      # merged into this repo (#349): the ADT client and REST server predate
      # lint enforcement. Remove once they are cleaned up.
      - path: abaper/internal/adt/client\.go
        linters: [errcheck, unused, staticcheck]
      - path: abaper/rest/
        linters: [errcheck, unused, staticcheck]
