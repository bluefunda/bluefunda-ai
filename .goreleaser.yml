version: 2

project_name: bai

builds:
  - id: bai
    main: ./cmd/bai
    binary: bai
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/bluefunda/bluefunda-ai/internal/cmd.Version={{ .Version }}
    flags:
      - -trimpath
  # abaper — the ABAPer brand binary, built from the same platform core.
  - id: abaper
    main: ./abaper/cmd/abaper
    binary: abaper
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/bluefunda/bluefunda-ai/internal/cmd.Version={{ .Version }}
    flags:
      - -trimpath

  # breq — the BlueRequests CLI, built from the same platform core.
  - id: breq
    main: ./breq/cmd/breq
    binary: breq
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/bluefunda/bluefunda-ai/internal/cmd.Version={{ .Version }}
    flags:
      - -trimpath

archives:
  - id: bai
    ids:
      - bai
    name_template: "bai_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
      - zip
    format_overrides:
      - goos: darwin
        formats:
          - zip
      - goos: linux
        formats:
          - tar.gz
    files:
      - none*
  - id: abaper
    ids:
      - abaper
    name_template: "abaper_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
      - zip
    format_overrides:
      - goos: darwin
        formats:
          - zip
      - goos: windows
        formats:
          - zip
      - goos: linux
        formats:
          - tar.gz
    files:
      - src: abaper/man/abaper.1
        dst: man/abaper.1
        strip_parent: false
  - id: breq
    ids:
      - breq
    name_template: "breq_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
      - zip
    format_overrides:
      - goos: darwin
        formats:
          - zip
      - goos: linux
        formats:
          - tar.gz
    files:
      - none*

nfpms:
  - id: bai
    package_name: bai
    file_name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - bai
    vendor: BlueFunda
    maintainer: BlueFunda <support@bluefunda.com>
    description: Cross-platform CLI for BlueFunda AI — context-aware AI agents for SAP operations.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /opt/bai/bin
    contents:
      - dst: /opt/bai/etc
        type: dir
      - dst: /opt/bai/log
        type: dir
      - dst: /usr/local/bin/bai
        src: /opt/bai/bin/bai
        type: symlink
  - id: abaper
    package_name: abaper
    file_name_template: "abaper_{{ .Os }}_{{ .Arch }}"
    ids:
      - abaper
    vendor: BlueFunda
    maintainer: BlueFunda <support@bluefunda.com>
    description: Cross-platform CLI for the ABAPer platform — AI pair programmer for SAP ABAP developers.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /opt/abaper/bin
    contents:
      - dst: /opt/abaper/etc
        type: dir
      - dst: /opt/abaper/log
        type: dir
      - dst: /usr/local/bin/abaper
        src: /opt/abaper/bin/abaper
        type: symlink
      - src: abaper/man/abaper.1
        dst: /usr/share/man/man1/abaper.1
  - id: breq
    package_name: breq
    file_name_template: "breq_{{ .Os }}_{{ .Arch }}"
    ids:
      - breq
    vendor: BlueFunda
    maintainer: BlueFunda <support@bluefunda.com>
    description: Cross-platform CLI for the BlueRequests change and release management platform.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /opt/breq/bin
    contents:
      - dst: /opt/breq/etc
        type: dir
      - dst: /opt/breq/log
        type: dir
      - dst: /usr/local/bin/breq
        src: /opt/breq/bin/breq
        type: symlink

notarize:
  macos:
    - enabled: true
      sign:
        certificate: "{{ .Env.MACOS_CERTIFICATE }}"
        password: "{{ .Env.MACOS_CERTIFICATE_PWD }}"
      notarize:
        issuer_id: "{{ .Env.NOTARIZATION_ISSUER_ID }}"
        key_id: "{{ .Env.NOTARIZATION_KEY_ID }}"
        key: "{{ .Env.NOTARIZATION_KEY }}"

brews:
  - name: bai
    ids:
      - bai
    homepage: https://github.com/bluefunda/bluefunda-ai
    description: CLI for BlueFunda AI — context-aware AI agents for SAP operations
    directory: Formula
    repository:
      owner: bluefunda
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    install: |
      bin.install "bai"

# abaper and breq keep the casks they have always shipped as
# (`brew install --cask abaper`, `brew install --cask breq`).
homebrew_casks:
  - name: abaper
    ids:
      - abaper
    binaries:
      - abaper
    homepage: https://github.com/bluefunda/bluefunda-ai
    description: CLI for the ABAPer platform — AI pair programmer for SAP ABAP developers
    directory: Casks
    repository:
      owner: bluefunda
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
  - name: breq
    ids:
      - breq
    binaries:
      - breq
    homepage: https://github.com/bluefunda/bluefunda-ai/tree/main/breq
    description: CLI for the BlueRequests change and release management platform
    directory: Casks
    repository:
      owner: bluefunda
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Software Bill of Materials for every release archive, using syft.
sboms:
  - id: archive-sboms
    artifacts: archive

# Keyless signing (Sigstore/Fulcio via GitHub OIDC) of the checksum manifest.
# Verifying the signed checksums.txt is sufficient to trust every archive:
#   cosign verify-blob --certificate-identity-regexp='.*' \
#     --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
#     --certificate checksums.txt.pem --signature checksums.txt.sig checksums.txt
signs:
  - id: checksum-sign
    cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: bluefunda
    name: bluefunda-ai
  draft: false
  replace_existing_draft: true
  name_template: "bai, abaper & breq v{{ .Version }}"
  header: |
    ## BlueFunda AI CLI (bai) v{{ .Version }}

    Cross-platform CLI for BlueFunda AI — context-aware AI agents for SAP operations.

    ### Installation

    **Homebrew (macOS):**
    ```bash
    brew tap bluefunda/tap
    brew install bai
    ```

    **One-line installer (macOS and Linux):**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/bluefunda/bluefunda-ai/main/install.sh | sh
    ```

    **Debian/Ubuntu (x86_64):**
    ```bash
    curl -sL https://github.com/bluefunda/bluefunda-ai/releases/latest/download/bai_linux_amd64.deb -o bai.deb
    sudo dpkg -i bai.deb
    ```

    **Debian/Ubuntu (ARM64):**
    ```bash
    curl -sL https://github.com/bluefunda/bluefunda-ai/releases/latest/download/bai_linux_arm64.deb -o bai.deb
    sudo dpkg -i bai.deb
    ```

    **RHEL / Fedora / Rocky (x86_64):**
    ```bash
    sudo rpm -i https://github.com/bluefunda/bluefunda-ai/releases/latest/download/bai_linux_amd64.rpm
    ```

    **RHEL / Fedora / Rocky (ARM64):**
    ```bash
    sudo rpm -i https://github.com/bluefunda/bluefunda-ai/releases/latest/download/bai_linux_arm64.rpm
    ```

    **macOS (manual):**
    ```bash
    curl -sL https://github.com/bluefunda/bluefunda-ai/releases/download/v{{ .Version }}/bai_{{ .Version }}_darwin_arm64.zip -o bai.zip
    unzip bai.zip && chmod +x bai && sudo mv bai /usr/local/bin/
    ```

    **Linux (manual):**
    ```bash
    curl -sL https://github.com/bluefunda/bluefunda-ai/releases/download/v{{ .Version }}/bai_{{ .Version }}_linux_amd64.tar.gz | tar xz
    chmod +x bai && sudo mv bai /usr/local/bin/
    ```

    ## ABAPer (abaper) v{{ .Version }}

    AI pair programmer for SAP ABAP developers, built on the same platform core.

    **Homebrew (macOS):**
    ```bash
    brew tap bluefunda/tap
    brew install --cask abaper
    ```

    **Debian/Ubuntu:** `abaper_linux_amd64.deb` / `abaper_linux_arm64.deb` · **RHEL/Fedora:** `abaper_linux_amd64.rpm` / `abaper_linux_arm64.rpm`

    **Manual:** `abaper_{{ .Version }}_<os>_<arch>` archives for macOS, Linux and Windows are attached below.

    ## BlueRequests (breq) v{{ .Version }}

    CLI for the BlueRequests change and release management platform, built on the same platform core. Also available as `bai requests`.

    **Homebrew (macOS):**
    ```bash
    brew tap bluefunda/tap
    brew install --cask breq
    ```

    **One-line installer (macOS and Linux):**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/bluefunda/bluefunda-ai/main/breq/install.sh | sh
    ```

    **Debian/Ubuntu:** `breq_linux_amd64.deb` / `breq_linux_arm64.deb` · **RHEL/Fedora:** `breq_linux_amd64.rpm` / `breq_linux_arm64.rpm`

    **Manual:** `breq_{{ .Version }}_<os>_<arch>` archives for macOS and Linux are attached below.

snapshot:
  version_template: "{{ incpatch .Version }}-next"
