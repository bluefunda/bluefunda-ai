version: "3.8"

services:
  abaper:
    image: ghcr.io/bluefunda/abaper:latest
    container_name: abaper-server
    restart: unless-stopped
    ports:
      - "8013:8080"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    # Per-request SAP credentials only (X-SAP-* headers); no shared SAP login.
    command: ["serve"]

networks:
  abaper-network:
    driver: bridge
